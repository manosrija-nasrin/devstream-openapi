get:
  summary: List all contents for the currently authenticated user.
  operationId: get-all-content
  tags:
    - Content
  security:
    - BearerAuth: []
  parameters:
    - name: platform
      in: query
      schema:
        $ref: ../schemas/TypeSupportedPlatform.yml
    - name: title
      in: query
      schema:
        type: string
    - name: publishedOn
      in: query
      schema:
        type: string
        format: date
    - name: hashtags
      in: query
      schema:
        type: array
        items:
          type: string
  responses:
    200:
      description: List of content retrieved successfully.
      content:
        application/json:
          schema:
            $ref: ../dto/ResponseGetUserContent.yml
    400:
      description: Bad request. Invalid filter parameters.
    404:
      description: No content found for the given filters.

post:
  summary: Publish content for the currently authenticated user.
  description: On successful completion of this request, the response contents
    a pre signed url in which the user needs to upload the content. On successful
    completion of document update, it's responsibility of the document uploading
    server to notify the application server that the content has been uploaded.
  operationId: create-content
  tags:
    - Content
  security:
    - BearerAuth: []
  responses:
    200:
      description: Contents the generated pre signed URL, on which the client
        has to upload the content.
      content:
        application/json:
          schema:
            $ref: ../dto/ResponsePreSignedURL.yml
    400:
      description: Invalid parameters for getting presigned URL.
